server.port=8080

# ---- In-process metrics pipeline configuration ----
# Tumbling window length (ms). Windows are aligned to the epoch, not to process start.
metrics.pipeline.window-size-millis=10000
# A sample up to this far behind its window close is still accepted into its own window.
metrics.pipeline.allowed-lateness-millis=5000
# Samples older than now - retention are pruned by the local scheduler.
metrics.pipeline.retention-millis=3600000
# Cadence of watermark advancement / rule evaluation.
metrics.pipeline.evaluation-period-millis=1000

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
